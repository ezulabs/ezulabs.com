name: Deploy to GitHub Pages
# and, once the repo variable DROPLET is "on", to the DigitalOcean droplet as well (the droplet job below). It needs:
#   secret DIGITALOCEAN_TOKEN    a token with firewall read+update and droplet read only (custom scopes)
#   secret DROPLET_SSH_KEY       a key that may only rsync into /srv/www/company (ezulabs-web: deploy.sh HOST add-key
#                                KEY.pub /srv/www/company), so this public repo can't reach anything else on the server
#   secret DROPLET_KNOWN_HOSTS   the droplet's host keys (ssh-keyscan)

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
# and, once the repo variable DROPLET is "on", to the DigitalOcean droplet as well (the droplet job below). It needs:
#   secret DIGITALOCEAN_TOKEN    a token with firewall read+update and droplet read only (custom scopes)
#   secret DROPLET_SSH_KEY       a key that may only rsync into /srv/www/company (ezulabs-web: deploy.sh HOST add-key
#                                KEY.pub /srv/www/company), so this public repo can't reach anything else on the server
#   secret DROPLET_KNOWN_HOSTS   the droplet's host keys (ssh-keyscan)
        id: deployment
        uses: actions/deploy-pages@v4

  droplet:
    if: vars.DROPLET == 'on'
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: droplet
      cancel-in-progress: false
    steps:
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact

      - name: Unpack it
        run: mkdir dist && tar -xf artifact/artifact.tar -C dist && test -f dist/index.html

      - name: SSH key and the droplet's host keys
        env:
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Open SSH to this run
        id: open
        env:
          TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          api() { curl -fsS -X "$1" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' ${3:+--data "$3"} "https://api.digitalocean.com/v2/$2"; }
          ip=$(curl -fsS https://api.ipify.org)
          fw=$(api GET firewalls | jq -r '.firewalls[] | select(.name=="ezulabs-web") | .id')
          host=$(api GET 'droplets?tag_name=ezulabs-web' | jq -r '.droplets[0].networks.v4[] | select(.type=="public") | .ip_address')
          api POST "firewalls/$fw/rules" "{\"inbound_rules\":[{\"protocol\":\"tcp\",\"ports\":\"22\",\"sources\":{\"addresses\":[\"$ip/32\"]}}]}"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"; echo "fw=$fw" >> "$GITHUB_OUTPUT"; echo "host=$host" >> "$GITHUB_OUTPUT"
          sleep 5

      - name: Upload to the droplet
        env:
          HOST: ${{ steps.open.outputs.host }}
        run: rsync -rlptz --delete --chmod=D755,F644 --exclude CNAME -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" dist/ "ops@$HOST:"

      - name: Close SSH again
        if: always() && steps.open.outputs.ip != ''
        env:
          TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          IP: ${{ steps.open.outputs.ip }}
          FW: ${{ steps.open.outputs.fw }}
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data "{\"inbound_rules\":[{\"protocol\":\"tcp\",\"ports\":\"22\",\"sources\":{\"addresses\":[\"$IP/32\"]}}]}" \
            "https://api.digitalocean.com/v2/firewalls/$FW/rules"
